# Edge Function config
# Deploy with: supabase functions deploy process-notifications
#
# Cron authenticates with a Secret API Key on the `apikey` header
# (not a JWT). Platform JWT verification must be off so those calls
# reach the function; authorization is enforced inside the handler.

[functions.process-notifications]
verify_jwt = false

# Notification center (admin test + Transport monthly report email).
# Cron for monthly report uses Secret API Key on apikey; admin actions use user JWT.
[functions.notification-center]
verify_jwt = false

# Controlled one-device Android FCM test. Platform JWT verification is off only
# so a server-side caller can supply both a project Secret API key and the
# dedicated NATIVE_FCM_TEST_SECRET header. The function enforces both itself.
[functions.process-native-fcm]
verify_jwt = false

# Permanent trusted LR dispatcher. It accepts only one trusted event ID and
# requires a project Secret API key; it is not a browser endpoint.
[functions.process-trusted-lr-notifications]
verify_jwt = false

# Bid reminder dispatcher (Phase 1, NOT YET DEPLOYED — review only).
# Cron uses a Secret API Key on apikey; authorization is enforced
# inside the handler. Scheduler activation stays manual.
[functions.process-bid-reminders]
verify_jwt = false
